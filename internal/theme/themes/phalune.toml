# Phalune default theme (Luna moth)
name = "phalune"
description = "Luna moth: moonlit night, quiet surfaces with a restrained celadon accent"
dark = true

[opacity]
bar = 0.75
overlay = 0.93
solid = 0.98
scrim = 0.55
shadow = 0.45

[colors]
surface = "#101315"
surface-raised = "#15191d"
surface-overlay = "#15191d"
surface-solid = "#0b0e11"

text = "#e8eae6"
text-dim = "#a8ada6"
text-faint = "#8a938a"
text-bright = "#ffffff"

accent = "#86b89b"
accent-hover = "#9ccbaf"
accent-active = "#6fa687"
accent-contrast = "#0d1712"
muted = "#6f7a72"

success = "#7fb98a"
warning = "#e5c463"
error = "#e06c75"
error-bright = "#eb828a"