name: release-dev

# Rolling prerelease from dev: no tests, no vet — dev is CI-free by
# policy. main stays the gated branch (ci.yml) and ships stable
# releases via release.yml on v* tags.
on:
  push:
    branches:
      - dev

jobs:
  release-dev:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    container:
      image: ghcr.io/bolbolius/phalune-ci:latest
    env:
      GOCACHE: ${{ github.workspace }}/.ci-cache/go-build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark workspace directory safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: .ci-cache/go-build
          key: go-dev-${{ runner.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-dev-${{ runner.arch }}-

      - name: Build dev binaries
        run: make build

      - name: Package
        run: |
          tag="dev-${{ github.sha }}"
          tar -czf "phalune-${tag}-x86_64.tar.gz" \
            phalune phalune-settings \
            data/org.phalune.shell.desktop \
            example/config.toml
          sha256sum "phalune-${tag}-x86_64.tar.gz" > "phalune-${tag}-x86_64.tar.gz.sha256"

      - name: Move dev tag
        run: |
          git tag -f dev
          git push -f origin dev

      - name: Publish rolling dev prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          prerelease: true
          name: "dev (${{ github.sha }})"
          files: |
            phalune-*.tar.gz
            phalune-*.tar.gz.sha256
