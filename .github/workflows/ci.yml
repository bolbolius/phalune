name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/bolbolius/phalune-ci:latest
    # Container filesystem is ephemeral; caches must live under the
    # workspace (mounted into the container) to survive across runs.
    env:
      GOCACHE: ${{ github.workspace }}/.ci-cache/go-build
    steps:
      - uses: actions/checkout@v4

      - name: Mark workspace directory safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: .ci-cache/go-build
          key: go-${{ runner.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.arch }}-

      - name: Build
        run: make build

      - name: Vet
        run: go vet ./...

      - name: Test
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          sleep 2
          DISPLAY=:99 go test ./...

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: phalune-binaries
          path: |
            phalune
            phalune-settings
