name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
    steps:
      - name: Bootstrap git
        run: xbps-install -Sy --repository=https://repo-fastly.voidlinux.org/current xbps git ca-certificates

      - uses: actions/checkout@v4

      - name: Fix git ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache xbps packages
        uses: actions/cache@v4
        with:
          path: /var/cache/xbps
          key: xbps-${{ runner.arch }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: xbps-${{ runner.arch }}-

      - name: Install system deps
        run: |
          xbps-install -Sy --repository=https://repo-fastly.voidlinux.org/current \
            make gcc \
            gtk4-devel \
            gtk4-layer-shell gtk4-layer-shell-devel \
            gobject-introspection \
            blueprint-compiler \
            go \
            pkg-config

      - name: Build
        run: make build

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: phalune-binaries
          path: |
            phalune
            phalune-settings
