name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/bolbolius/phalune-ci:latest
    steps:
      - uses: actions/checkout@v4

      - name: Mark workspace directory safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.arch }}-

      - name: Build
        run: make build

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: phalune-binaries
          path: |
            phalune
            phalune-settings
