# phalune configuration file
# Default search locations:
#   1. $XDG_CONFIG_HOME/phalune/config.toml
#   2. ~/.config/phalune/config.toml
#
# All values below are set to their defaults.
# Unknown fields are silently ignored (and logged).
# Invalid values fall back to defaults (and logged).

# ─── Theme ─────────────────────────────────────────────────────────────────────

[theme]
# Color palette: built-in ("phalune", "tokyo-night", "dracula"),
# dynamic ("from-wallpaper" via matugen), or ~/.config/phalune/themes/<name>.toml
name = "phalune"

# Optional token overrides:
# [theme.values]
# accent = "#ff79c6"
# surface = [40, 42, 54]
# text = "#f8f8f2"

# ─── Bar ───────────────────────────────────────────────────────────────────────

[bar]
# Height of the top bar in pixels (exclusive zone will be reserved accordingly)
height = 32

# Bar position on screen: "top" or "bottom"
position = "top"

# Bar UI style: "bubble" (default), "solid", "minimal"
style = "bubble"

# Left section widgets (arranged horizontally from left to right)
[bar.left]
widgets = ["workspaces"]

# Center section widgets (mathematically centered on the screen)
[bar.center]
widgets = ["clock"]

# Right section widgets (arranged horizontally on the far right)
[bar.right]
widgets = ["privacy", "tray", "wifi", "bluetooth", "audio", "battery", "keyboard", "clipboard", "notifications", "ipc:demo", "power"]

# ─── Widget: Workspaces ───────────────────────────────────────────────────────

[bar.workspaces]
# Show workspaces from all monitors (true) or only the current monitor (false)
all_outputs = false

# ─── Widget: Clock ────────────────────────────────────────────────────────────

[bar.clock]
# Time format string using Go reference time format:
# Reference: Mon Jan 2 15:04:05 MST 2006
# Examples:
#   "15:04"          -> 24-hour hour and minute (e.g. 14:30)
#   "15:04:05"       -> 24-hour with seconds (e.g. 14:30:15)
#   "03:04 PM"       -> 12-hour format with AM/PM (e.g. 02:30 PM)
#   "Mon Jan 2 15:04"-> Date and time
format = "15:04"

# Tick interval for clock updates: "1s" or "1m"
# Use "1m" if your format doesn't include seconds to save CPU
interval = "1s"

# ─── Widget: Audio ────────────────────────────────────────────────────────────

[bar.audio]
# Volume change per scroll tick (percentage points)
step = 5

# Maximum volume ceiling (set > 100 to allow boost past 100%)
max_volume = 100

# Scroll rate limit in milliseconds (lower = more responsive, higher = smoother)
scroll_debounce_ms = 20

# Volume label format string (Go fmt, receives int percentage)
format = "%d%%"

# Text shown on the bar when audio is muted
muted_label = "Muted"

# ─── Widget: Battery ──────────────────────────────────────────────────────────

[bar.battery]
# Percentage at or below which the "low" CSS class is applied
low_threshold = 15

# Percentage at or above which the battery is considered fully charged
full_threshold = 98

# Backup poll interval between kernel uevent notifications
poll_interval = "30s"

# Battery label format string (Go fmt, receives int percentage)
format = "%d%%"

# ─── Widget: System Tray ──────────────────────────────────────────────────────

[bar.tray]
# Preferred icon size in pixels for tray icon pixmaps
icon_size = 16

# ─── Widget: Bluetooth ────────────────────────────────────────────────────────

[bar.bluetooth]
# Whether to show text status next to the icon ("On" / "Off" / "Unavailable")
show_label = true

# Automatically hide the widget if no Bluetooth adapter is detected
hide_unavailable = false

# ─── Widget: Wi-Fi ────────────────────────────────────────────────────────────

[bar.wifi]
# Whether to show text status next to the icon (SSID / "Off" / "Disconnected")
show_label = true

# Automatically hide the widget if no Wi-Fi interface is detected
hide_unavailable = false

# ─── Widget: Keyboard ─────────────────────────────────────────────────────────

[bar.keyboard]
# Display format for keyboard layout label (receives shortened layout string, e.g. "US", "FA")
format = "%s"

# Whether to show the keyboard icon next to the layout label
show_icon = true

# ─── Widget: Power ────────────────────────────────────────────────────────────

[bar.power]
# Icon name for the power widget button on the bar
icon = "system-shutdown-symbolic"

# ─── Widget: IPC (Tier 2 extensions) ──────────────────────────────────────────
# "ipc:<id>" entries in a bar section render state pushed by external
# programs over the IPC socket ($XDG_RUNTIME_DIR/phalune.sock).
# See docs/IPC.md for the protocol and scripts/ipc_showcase.py for an interactive demo.
#
# Push updates from any script:
#   phalune msg widget push --id=demo --text="🍅 18:42" --class=running
# Long-running daemons stream NDJSON on:
#   phalune msg widget watch --id=demo
# Or run the showcase:
#   python3 scripts/ipc_showcase.py --id demo

[bar.ipc.demo]
# Tooltip fallback when a push carries none
tooltip = "IPC Demo Showcase"
# Hide the pill once it is cleared (default true)
hide_when_clear = true


# ─── Lock Screen ──────────────────────────────────────────────────────────────

[lockscreen]
# Time format string on the lock screen (Go reference time format)
time_format = "15:04"

# Date format string on the lock screen
date_format = "Monday, January 2"

# Optional external authentication command (e.g. for custom pam wrapper or testing).
# When empty, phalune uses standard setuid unix_chkpwd helper for PAM password verification.
auth_command = ""

# ─── Session Management ───────────────────────────────────────────────────────

[session]
# Whether to automatically lock the screen when the system prepares for sleep/suspend
lock_on_sleep = true

# Optional command overrides for session power actions (leave empty for built-in logind/Niri handling)
# command_lock = ""
# command_logout = ""
# command_suspend = ""
# command_hibernate = ""
# command_reboot = ""
# command_poweroff = ""

# ─── Power Menu ───────────────────────────────────────────────────────────────

[power_menu]
# Whether to show the Hibernate action button in the power menu
show_hibernate = true


# ─── Notifications ────────────────────────────────────────────────────────────

[notifications]
# Popup UI style: "bubbles" (default), "compact"
style = "bubbles"

# Screen anchor position: "top-right", "top-left", "bottom-right", "bottom-left", "top", "bottom", "center"
anchor = "top-right"

# Auto-dismiss duration for low urgency notifications
timeout_low = "3s"

# Auto-dismiss duration for normal urgency notifications
timeout_normal = "5s"

# Whether critical notifications stay until manually dismissed
critical_sticky = true

# Margins from screen edges in pixels
margin_top = 16
margin_right = 16
margin_bottom = 16
margin_left = 16

# ─── OSD (On-Screen Display) ──────────────────────────────────────────────────

[osd]
# OSD UI style: "pill" (rounded), "bar" (wide strip), "minimal" (icon + bar)
style = "pill"

# Screen anchor position: "bottom", "top", "center", "bottom-left", "bottom-right", "top-left", "top-right"
anchor = "bottom"

# Auto-hide duration after showing
timeout = "2s"

# Margins from screen edges in pixels
margin_bottom = 64
margin_top = 64
margin_left = 0
margin_right = 0

# Enable smooth morph animation on volume / brightness adjustments
animate = true

# Morph animation duration in milliseconds
animation_duration_ms = 120

# ─── Control Center ───────────────────────────────────────────────────────────

[control_center]
# Control center UI style: "cards" (default), "compact"
style = "cards"

# ─── Launcher ─────────────────────────────────────────────────────────────────

[launcher]
# Launcher UI style: "centered" (default), "fullscreen", "compact"
style = "centered"

# Number of rows jumped on Page Up / Page Down
page_size = 6

# Preferred terminal emulator for launching terminal applications.
# Leave empty to auto-detect from: alacritty, kitty, foot, wezterm, gnome-terminal, xterm
terminal = ""

[launcher.frecency]
# Decay half-life in days for app launch frequency scoring
half_life_days = 7.0

# Maximum search score bonus from frecency
max_boost = 25.0

# ─── Window Switcher ──────────────────────────────────────────────────────────

[window_switcher]
# Whether to switch across windows from all workspaces (true) or only the current workspace (false)
all_workspaces = true

# ─── Screenshots ──────────────────────────────────────────────────────────────
[screenshot]
# Fallback capture mode: "area" (interactive selection), "window" (focused window)
# or "display" (full output). Requires grim (and slurp for area selection).
default_mode = "area"

# Destination folder for saved screenshots. Empty = ~/Pictures/Screenshots
# save_dir = ""

# How long the actionable preview toast stays visible before auto-dismiss
toast_timeout = "6s"

# ─── Clipboard History ────────────────────────────────────────────────────────
[clipboard]
# Maximum number of entries kept in history (ring buffer)
max_entries = 30

# Persist clipboard history to ~/.cache/phalune/clipboard across restarts
persist = true

# Maximum size in bytes for captured image textures (default: 16 MiB)
max_image_bytes = 16777216

# Maximum size in bytes for captured text entries (default: 1 MiB)
max_text_bytes = 1048576

# Application IDs / window titles / MIME types to ignore
# Password managers are automatically excluded based on Wayland password-manager hints
# ignored_apps = ["KeePassXC", "Bitwarden"]
# blacklist = ["1Password"]

# ─── Wallpaper ────────────────────────────────────────────────────────────────
# Built-in background wallpaper manager rendered on layer-shell background.

[wallpaper]
# Enable built-in wallpaper management (false by default)
enabled = false

# Path to a wallpaper image or a folder of images for slideshow
# Supports PNG, JPEG, WebP, SVG, AVIF, etc.
path = ""

# Scaling mode: "fill" (crop & cover), "fit" (contain), "center", "stretch"
mode = "fill"

# Auto-rotation slideshow interval when path points to a directory
# Set to "0" or empty to disable rotation. Examples: "15m", "1h", "30s"
interval = "0s"

# Per-output custom wallpapers (overrides path for specific monitors)
# [wallpaper.outputs]
# "eDP-1" = "~/Pictures/Wallpapers/laptop.png"
# "DP-1" = "~/Pictures/Wallpapers/desktop.png"

# ─── Logging ──────────────────────────────────────────────────────────────────

[logging]
# Console log level: "debug", "info", "warn", "error"
level = "info"

# Optional explicit console log level override
# console_level = "debug"

# Enable or disable forwarding log messages to desktop notifications
notify = false

# Notification log level: only messages at or above this level trigger notifications
notify_level = "warn"

